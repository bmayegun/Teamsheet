spring.application.name=teamsheet
server.port=${PORT:8080}
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

#---
spring.config.activate.on-profile=roster
# Replaces the entire default exclusion list; preserve any future non-datasource exclusions here.
spring.autoconfigure.exclude=
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
server.servlet.session.cookie.secure=${ROSTER_SECURE_COOKIE:true}
server.servlet.session.cookie.same-site=lax
teamsheet.roster.jdbc-url=${ROSTER_JDBC_URL:}
teamsheet.email.resend-api-key=${RESEND_API_KEY:}
teamsheet.email.sender-email=${RESEND_SENDER_EMAIL:}
teamsheet.email.code-secret=${EMAIL_CODE_SECRET:}
teamsheet.email.mailpit-url=${MAILPIT_URL:}

# Trust only verified ingress CIDRs; forwarded headers from all other peers are ignored.
teamsheet.auth.trusted-proxies=${AUTH_TRUSTED_PROXY_CIDRS:}
# Resolve addresses explicitly for auth limits rather than trusting arbitrary forwarding headers.
server.forward-headers-strategy=none
